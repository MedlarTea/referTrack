# @package habitat.simulator.agents.spot_agent
defaults:
  - /habitat/simulator/sim_sensors@sim_sensors.jaw_rgb_sensor: jaw_rgb_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.left_rgb_sensor: left_rgb_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.right_rgb_sensor: right_rgb_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.back_rgb_sensor: back_rgb_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.jaw_panoptic_sensor: jaw_panoptic_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.left_panoptic_sensor: left_panoptic_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.right_panoptic_sensor: right_panoptic_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.back_panoptic_sensor: back_panoptic_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.third_rgb_sensor: third_rgb_sensor

sim_sensors:
  jaw_rgb_sensor:
    height: 384
    width: 384
    hfov: 90
  jaw_panoptic_sensor:
    height: 384
    width: 384
    hfov: 90
  third_rgb_sensor:
    height: 384
    width: 384
  left_rgb_sensor:
    height: 384
    width: 384
    hfov: 90
  right_rgb_sensor:
    height: 384
    width: 384
    hfov: 90
  back_rgb_sensor:
    height: 384
    width: 384
    hfov: 90
  left_panoptic_sensor:
    height: 384
    width: 384
    hfov: 90
  right_panoptic_sensor:
    height: 384
    width: 384
    hfov: 90
  back_panoptic_sensor:
    height: 384
    width: 384
    hfov: 90
